# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}) ${{ matrix.config.special }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release', nosuggests: false, args: 'c("--no-manual", "--as-cran")'}
          - {os: windows-latest, r: 'release', nosuggests: false, args: 'c("--no-manual", "--as-cran")'}
          - {os: ubuntu-latest,   r: 'devel', nosuggests: false, http-user-agent: 'release', args: 'c("--no-manual", "--as-cran")'}
          - {os: ubuntu-latest,   r: 'release', nosuggests: false, args: 'c("--no-manual", "--as-cran")'}
          - {os: ubuntu-latest,   r: 'oldrel-1', nosuggests: false, args: 'c("--no-manual", "--as-cran")'}
          - {os: ubuntu-latest,   r: 'release', nosuggests: true, special: "No Suggests", args: 'c("--no-manual", "--as-cran")'}
          - {os: ubuntu-latest,   r: 'release', nosuggests: false, special: "Not as CRAN", args: 'c("--no-manual")'}

    env:
      _R_CHECK_DEPENDS_ONLY_: ${{ matrix.config.nosuggests }}
      _R_CHECK_DEPENDS_ONLY_VIGNETTES_: false
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::XML
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: ${{ matrix.config.args }}
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
